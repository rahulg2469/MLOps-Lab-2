name: Lab 2 - Nightly Model Search and Calibration

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC every day
  workflow_dispatch:
    inputs:
      calibration_method:
        description: "Calibration method"
        type: choice
        options: [sigmoid, isotonic]
        default: sigmoid
      min_f1:
        description: "Quality gate: minimum test F1"
        default: "0.90"

permissions:
  contents: write

concurrency:
  group: lab2-model-commits
  cancel-in-progress: false

env:
  CALIBRATION_METHOD: ${{ inputs.calibration_method || 'sigmoid' }}
  MIN_F1: ${{ inputs.min_f1 || '0.90' }}

defaults:
  run:
    working-directory: Labs/Github_Labs/Lab2

jobs:
  nightly-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Labs/Github_Labs/Lab2/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate timestamp
        run: echo "TIMESTAMP=$(date -u '+%Y%m%d%H%M%S')" >> "$GITHUB_ENV"

      - name: Train model with a random hyperparameter config
        run: python src/train_model.py --timestamp "$TIMESTAMP" --search-seed "$TIMESTAMP"

      - name: Calibrate model
        run: python src/calibrate_model.py --timestamp "$TIMESTAMP" --method "$CALIBRATION_METHOD"

      - name: Evaluate and compare with current model
        id: evaluate
        run: python src/evaluate_model.py --timestamp "$TIMESTAMP" --min-f1 "$MIN_F1" --compare-latest

      - name: Commit models and metrics (only if better)
        if: steps.evaluate.outputs.promote == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/ metrics/
          git commit -m "Lab2 nightly: promote model $TIMESTAMP"
          git pull --rebase
          git push

      - name: Keep current model
        if: steps.evaluate.outputs.promote != 'true'
        run: echo "New model did not beat the current one. Nothing committed."