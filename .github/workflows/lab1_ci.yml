# CHANGE: replaces the separate pytest_action.yml and unittest_action.yml
name: Lab1 CI - Lint, Test, Coverage

on:
  push:
    branches: [main]
    paths:
      - 'Labs/Github_Labs/Lab1/**'
      - '.github/workflows/lab1_ci.yml'
  pull_request:            # CHANGE: also runs on PRs
    branches: [main]
    paths:
      - 'Labs/Github_Labs/Lab1/**'
      - '.github/workflows/lab1_ci.yml'
  workflow_dispatch:       # CHANGE: manual "Run workflow" button

# CHANGE: a newer push cancels the older run on the same branch
concurrency:
  group: lab1-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Labs/Github_Labs/Lab1

jobs:
  # CHANGE: lint job runs first
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Labs/Github_Labs/Lab1/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src test

  # CHANGE: tests only run if lint passes, on 3 Python versions in parallel
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5   # CHANGE: v4 -> v5, built-in pip cache
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Labs/Github_Labs/Lab1/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # CHANGE: coverage gate - fails the build if coverage of src/ drops below 90%
      - name: Run pytest with coverage gate
        run: >
          python -m pytest test/test_pytest.py -v
          --junitxml=pytest-report.xml
          --cov=src --cov-report=xml --cov-report=term-missing
          --cov-fail-under=90

      - name: Run unittest
        run: python -m unittest test.test_unittest -v

      # CHANGE: unique artifact name per Python version (required by upload-artifact v4)
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            Labs/Github_Labs/Lab1/pytest-report.xml
            Labs/Github_Labs/Lab1/coverage.xml
          if-no-files-found: warn

      # CHANGE: results table on the run's summary page
      - name: Write job summary
        if: always()
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" << 'PYEOF'
          import os
          import xml.etree.ElementTree as ET

          py = os.environ["PY_VERSION"]
          print(f"### Python {py}")
          print("| Metric | Value |")
          print("|---|---|")
          try:
              root = ET.parse("pytest-report.xml").getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              total = int(suite.get("tests"))
              failed = int(suite.get("failures")) + int(suite.get("errors"))
              print(f"| Pytest tests | {total} |")
              print(f"| Passed | {total - failed - int(suite.get('skipped'))} |")
              print(f"| Failed | {failed} |")
          except Exception:
              print("| Pytest report | not found |")
          try:
              rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
              print(f"| Coverage (src/) | {rate * 100:.1f}% |")
          except Exception:
              print("| Coverage report | not found |")
          print("| Coverage threshold | 90% |")
          PYEOF

      - name: Notify on success
        if: success()
        run: echo "Lint, tests and coverage gate passed on Python ${{ matrix.python-version }}"

      - name: Notify on failure
        if: failure()
        run: echo "Pipeline failed on Python ${{ matrix.python-version }} - check lint, tests or coverage"
